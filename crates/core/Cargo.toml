[package]
name = "paste2prompt-core"
description = "Edit model, caption text and PNG export for paste2prompt. No browser dependencies."
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

# Keep this crate free of web-sys / wasm-bindgen: it is tested natively with
# `cargo test` and must build unchanged for wasm32-unknown-unknown.
[dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` makes f64 coordinates parse back bit-for-bit, so JSON
# round trips are lossless.
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
# Inline snapshot tests for the caption text (Apache-2.0).
insta = "1.49.0"
