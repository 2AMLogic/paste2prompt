[package]
name = "paste2prompt-core"
description = "Edit model, caption text and PNG export for paste2prompt. No browser dependencies."
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

# Keep this crate free of web-sys / wasm-bindgen: it is tested natively with
# `cargo test` and must build unchanged for wasm32-unknown-unknown.
[dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` makes f64 coordinates parse back bit-for-bit, so JSON
# round trips are lossless.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Export rendering (spec §Architecture → Rendering). CPU rasterizer, so the
# export is identical in every browser (BSD-3-Clause). No `png-format`: we
# encode ourselves to write an opaque RGB PNG.
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
# Caption and badge text from the bundled Inter subset only, so output
# doesn't depend on the machine (see `render/text.rs`). harfrust shapes it
# (kerning, ligatures; MIT), read-fonts reads the glyph outlines that
# tiny-skia fills (MIT OR Apache-2.0), and unicode-linebreak finds the line
# break opportunities (Apache-2.0). These are the versions cosmic-text used
# before #43 replaced it, so shaping and line breaks are unchanged.
harfrust = { version = "0.5.2", default-features = false, features = ["std"] }
read-fonts = { version = "0.45.0", default-features = false, features = ["std"] }
unicode-linebreak = "0.1.5"
# Plain PNG encode of the export; no text chunks (MIT OR Apache-2.0).
png = "0.18.1"
# NFC-normalizes caption text before the font-coverage check, so decomposed
# accents (e + U+0301) draw as the subset's precomposed glyph (MIT OR
# Apache-2.0). Only its per-character functions are used, so the
# compatibility tables stay out of the wasm (see `render/text.rs`).
unicode-normalization = { version = "0.1.25", default-features = false }

[dev-dependencies]
# Inline snapshot tests for the caption text (Apache-2.0).
insta = "1.49.0"
