# Dependency license gate (CLAUDE.md rule 3): permissive licenses only, so
# nothing forces a copyleft relicense of this PolyForm Noncommercial project.
# Run locally with `cargo deny check licenses`.

[graph]
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",   # xxhash-rust (via leptos)
    "CC0-1.0",   # base16 (via leptos)
]
confidence-threshold = 0.9
# Some allowances are for crates the spec plans next (e.g. tiny-skia is BSD-3-Clause).
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are PolyForm Noncommercial via `license-file`; they're not
# published, so the gate only judges third-party code.
ignore = true
