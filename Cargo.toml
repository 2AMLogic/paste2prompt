[workspace]
resolver = "3"
members = ["crates/core", "crates/web", "crates/embed"]
# Vendored tooling trees (Loom, Claude, agent skills) are not part of the
# Rust build, even if they ever ship a Cargo.toml of their own.
exclude = [".loom", ".claude", ".agents"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/2AMLogic/paste2prompt"
publish = false

[workspace.dependencies]
paste2prompt-core = { path = "crates/core" }
leptos = { version = "0.8.22", features = ["csr"] }
console_error_panic_hook = "0.1.7"
# Pinned to the versions leptos already pulls in, so the lockfile only gains
# feature flags. Browser features are enabled per crate (see crates/web).
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = "0.3.106"

[profile.release]
# Smaller wasm for the static site; build speed matters less than download size.
# Measured for #27 (trunk build --release, wasm-opt -Os, gzip -9 / brotli -q 11):
# this profile ships 1,932,410 B raw / 757,545 B gz / 591,129 B br. opt-level
# "s" is +81 KB gz and lto = "thin" is +52 KB gz. Don't set `strip`: the
# wasm has no symbols to strip once wasm-opt drops the name section, and it
# also removes the target_features section, so wasm-opt then rejects the
# bulk-memory ops and the build fails.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
